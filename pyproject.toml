[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-linux-hardware-assistant"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "typer==0.15.1", "rich==13.9.4"]

[project.scripts]
hardware-assistant = "hardware_assistant.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]
